<script>
/* Load translation dictionaries only when a non-Korean locale is needed. */
(function(){
"use strict";
const select=document.getElementById("kcamp-language");
const langs=["ko","en","zh-CN","vi","uz","mn","ru","ar","id","ur"];
const scripts=["lang-core.js","lang-extra.js","lang-multicultural-a.js","lang-multicultural-b.js","lang-multicultural-ui.js","i18n.js"];
let loadPromise=null;
function initialLanguage(){
 let saved="";
 try{saved=localStorage.getItem("kcamp-language")||"";}catch(_){}
 if(langs.includes(saved))return saved;
 const preferences=Array.from(navigator.languages||[navigator.language||"ko"]);
 for(const value of preferences){
  const lang=String(value).toLowerCase();
  if(lang.startsWith("ar"))return "ar";
  if(lang.startsWith("id")||lang==="in-id")return "id";
  if(lang.startsWith("ur"))return "ur";
  if(lang.startsWith("zh"))return "zh-CN";
  if(lang.startsWith("vi"))return "vi";
  if(lang.startsWith("uz"))return "uz";
  if(lang.startsWith("mn"))return "mn";
  if(lang.startsWith("ru"))return "ru";
  if(lang.startsWith("en"))return "en";
  if(lang.startsWith("ko"))return "ko";
 }
 return "ko";
}
function loadTranslations(){
 if(loadPromise)return loadPromise;
 loadPromise=Promise.all(scripts.map(function(name){
  return new Promise(function(resolve,reject){
   const el=document.createElement("script");
   el.async=false;
   el.src="./"+name+"?v=20261102-fast-1";
   el.onload=resolve;
   el.onerror=function(){reject(Error("Failed to load "+name));};
   document.head.appendChild(el);
  });
 })).then(function(){
  if(typeof window.kcampRerender==="function")window.kcampRerender();
 }).catch(function(error){loadPromise=null;throw error;});
 return loadPromise;
}
const preferred=initialLanguage();
if(select){
 select.value=preferred;
 select.addEventListener("change",function(){
  const next=select.value;
  try{localStorage.setItem("kcamp-language",next);}catch(_){}
  if(typeof window.kcampSwitchLanguage==="function")return;
  if(next==="ko"){
   document.documentElement.lang="ko";
   if(typeof window.kcampRerender==="function")window.kcampRerender();
   return;
  }
  select.disabled=true;
  loadTranslations().then(function(){
   if(typeof window.kcampSwitchLanguage==="function")window.kcampSwitchLanguage(next);
  }).catch(function(){select.value="ko";}).finally(function(){select.disabled=false;});
 });
}
if(preferred!=="ko"){
 setTimeout(function(){loadTranslations().catch(function(){});},0);
}
})();
</script>

function renderIntro(){root.innerHTML='<section class="hero"><div class="hero-copy"><span class="eyebrow">2026 K-INTERNATIONAL STUDENT CAREER CAMP</span><h1>K-유학생<br><em>취업캠프</em></h1><p>2026학년도 K-유학생 취업캠프<br>사전 취업 인식·준비도 조사 및 입사지원서 제출</p><div class="pills"><span>취업 인식</span><span>5점 준비도 진단</span><span>현직자 멘토링</span><span>서류 준비</span></div></div><div class="hero-visual"><div class="book"><small>CAREER PASSPORT</small><strong>YOUR<br>NEXT<br>STEP</strong><small>EXPLORE · PREPARE · GROW</small></div></div></section>'+(config&&!config.open?'<div class="notice">설문 접수 준비 중입니다. 문항 미리보기는 가능하지만 실제 제출은 열리지 않았습니다.</div>':'')+'<div class="intro-info"><article><b>01. 취업 인식·희망 직무</b><small>한국 취업 의향과 관심 산업·기업을 파악합니다.</small></article><article><b>02. 취업 준비도 자가진단</b><small>이력서·면접·채용지원 수준을 5점으로 평가합니다.</small></article><article><b>03. 서류 준비 안내</b><small>이력서·자기소개서는 이메일 사전 제출 또는 당일 노트북 지참</small></article></div>'+renderCampGuide()+renderDocumentReminder();document.getElementById("start").onclick=()=>{page=0;answers.requestId=answers.requestId||crypto.randomUUID();renderSurvey();};}
function field(n,label,inner,hint){return '<div class="field"><strong><span style="color:#aa6880;margin-right:8px">'+n+'</span><span data-camp-source="'+encodeURIComponent(label)+'">'+esc(label)+'</span> <i>*</i></strong>'+(hint?'<p class="hint">'+esc(hint)+'</p>':'')+inner+'</div>';}
function inp(k,placeholder,type){return '<input class="text" data-field="'+k+'" type="'+(type||'text')+'" value="'+esc(answers[k]||'')+'" placeholder="'+esc(placeholder||'답변을 입력해 주세요')+'" maxlength="250">';}
function para(k,ph){return '<textarea class="text" data-field="'+k+'" rows="4" maxlength="1500" placeholder="'+esc(ph||'자유롭게 작성해 주세요')+'">'+esc(answers[k]||'')+'</textarea>';}
function choice(k,items,multi){return '<div class="options '+(multi?'multiple':'')+'">'+items.map(o=>'<button type="button" class="option" data-key="'+k+'" data-choice="'+esc(o)+'" data-multi="'+(multi?'1':'0')+'" aria-pressed="'+(multi?(answers[k]||[]).includes(o):answers[k]===o)+'">'+esc(o)+'</button>').join("")+'</div>';}
function optField(n,k,label,list,multi){return field(n,label,choice(k,list,!!multi));}
function showStep(){if(page===0)return field("01","성명",inp("name","캠프 신청 시 사용한 성명"))+field("02","소속 대학",inp("university","대학교 이름"))+field("03","학과·전공",inp("major","학과 이름"))+optField("04","grade","학년·학적",options.grade)+optField("05","graduation","졸업 예정 시기",options.graduation)+field("06","연락 가능한 이메일",inp("email","name@example.com","email"))+field("07","휴대전화 연락처",inp("phone","010-0000-0000","tel"));
if(page===1)return optField("08","intent","한국에서 취업할 의향은 어느 정도인가요?",options.intent)+optField("09","region","희망 근무지역은 어디인가요?",options.region)+optField("10","industries","관심 산업·분야를 모두 선택해 주세요.",options.industries,true)+field("11","가장 관심 있는 직무 또는 하고 싶은 일",inp("job","미정이면 '미정' 입력"))+field("12","관심 기업·채용공고 (선택사항)",para("company","기업명이나 공고 URL을 작성하세요."))+optField("13","difficulties","한국 취업 준비에서 가장 어려운 점은?",options.difficulties,true);
if(page===2)return '<div class="field"><strong>14. 다음 6개 준비도 항목을 1~5점으로 평가해 주세요. <i>*</i></strong><p class="hint">1점 전혀 준비되지 않음 · 3점 보통 · 5점 충분히 준비됨</p>'+readiness.map((s,i)=>'<div class="rating"><span>'+(i+1)+'. '+esc(s)+'</span><div class="scores">'+[1,2,3,4,5].map(n=>'<button type="button" data-rating="'+i+'" data-score="'+n+'" aria-pressed="'+((answers.readiness||[])[i]===n)+'">'+n+'</button>').join("")+'</div></div>').join("")+'</div>'+optField("15","stage","현재 취업 준비 단계",options.stage)+optField("16","korean","한국어로 면접·상담하는 데 어려움이 있나요?",options.korean)+optField("17","resumeStatus","이력서(Resume/CV) 준비 상태",options.docStatus)+optField("18","introStatus","자기소개서(Self-Introduction Letter) 준비 상태",options.docStatus);
if(page===3)return optField("19","mentoring","캠프에서 가장 도움받고 싶은 내용 (최대 2개)",options.mentoring,true)+field("20","현직자에게 꼭 물어보고 싶은 질문 (선택사항)",para("mentorQuestion","궁금한 점을 자유롭게 적으세요."));
if(page===4)return fileNotice();
return '<div class="privacy"><strong>개인정보 수집·이용 안내</strong><dl><dt>처리 주체</dt><dd>'+esc(config.controller)+'</dd><dt>수집 항목</dt><dd>성명, 소속, 연락처, 취업 인식·준비도, 희망직무·멘토링 요구</dd><dt>이용 목적</dt><dd>캠프 상담 및 멘토링 준비, 서류 컨설팅</dd><dt>보유 기한</dt><dd>'+esc(config.retention)+'</dd><dt>문의처</dt><dd>'+esc(config.contact)+'</dd><dt>제3자 제공받는 자</dt><dd>'+esc(config.recipient)+'</dd><dt>제3자 보유 기한</dt><dd>'+esc(config.recipientRetention)+'</dd></dl><p class="small">동의를 거부할 수 있습니다. 필수 수집·이용에 동의하지 않으면 사전 설문 제출은 제한됩니다. 현직자 자료 제공을 거부할 수 있으며 이 경우 관련 자료의 멘토 공유가 제한됩니다.</p></div>'+optField("23","consentUse","개인정보 수집·이용에 동의하십니까?",["동의합니다","동의하지 않습니다"])+optField("24","consentShare","현직자에게 희망직무 정보 및 별도로 제출한 입사지원서 제공에 동의하십니까?",["동의합니다","동의하지 않습니다"]);
}
function upload(n,key,title,f){return '<div class="field"><strong>'+n+' '+esc(title)+' <span class="small">(선택)</span></strong><div class="upload"><div style="font-size:29px;color:#85516b">⇧</div><p>'+(f?esc(f.name):"PDF 또는 DOCX · 8MB 이하 · 미완성 초안 가능")+'</p><label>파일 선택<input type="file" data-upload="'+key+'" accept=".pdf,.docx"></label>'+(f?'<button type="button" class="secondary" data-remove="'+key+'">선택 취소</button>':'')+'</div></div>';}
function getError(){let a=answers;if(page===0&&![a.name,a.university,a.major,a.grade,a.graduation,a.email,a.phone].every(x=>String(x||"").trim()))return"기본정보를 모두 작성해 주세요.";if(page===0&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email)||!/^[\d+\s()-]{8,25}$/.test(a.phone)))return"이메일 또는 연락처를 확인해 주세요.";if(page===1&&(!a.intent||!a.region||!(a.industries||[]).length||!a.job||!(a.difficulties||[]).length))return"필수 취업 인식 질문을 모두 작성해 주세요.";if(page===2&&(!(a.readiness||[]).every(n=>Number.isInteger(n)&&n>=1&&n<=5)||a.readiness.length!==6||!a.stage||!a.korean||!a.resumeStatus||!a.introStatus))return"준비도 6개 항목과 준비 상태를 모두 입력해 주세요.";if(page===3&&!(a.mentoring||[]).length)return"멘토링 희망 항목을 1개 이상 선택해 주세요.";if(page===5&&a.consentUse!=="동의합니다")return"개인정보 수집·이용에 동의해야 제출할 수 있습니다.";if(page===5&&!a.consentShare)return"현직자 제공에 대한 동의 여부를 선택해 주세요.";return"";}
function bind(){root.querySelectorAll("[data-field]").forEach(el=>{el.addEventListener("input",()=>set(el.dataset.field,el.value));});root.querySelectorAll("[data-key]").forEach(el=>el.onclick=()=>{let k=el.dataset.key,v=el.dataset.choice;if(el.dataset.multi==="1"){let arr=answers[k]||[];if(arr.includes(v))arr=arr.filter(x=>x!==v);else if(k!=="mentoring"||arr.length<2)arr=[...arr,v];set(k,arr);}else set(k,v);root.querySelectorAll('[data-key="'+k+'"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.multi==="1"?String((answers[k]||[]).includes(b.dataset.choice)):String(answers[k]===b.dataset.choice)));});root.querySelectorAll("[data-rating]").forEach(el=>el.onclick=()=>{let i=+el.dataset.rating;answers.readiness=answers.readiness||[0,0,0,0,0,0];answers.readiness[i]=+el.dataset.score;root.querySelectorAll('[data-rating="'+i+'"]').forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.score===+el.dataset.score)));});root.querySelectorAll("[data-upload]").forEach(el=>el.onchange=()=>{let f=el.files[0];if(!f)return;if(!/\.(pdf|docx)$/i.test(f.name)||f.size>8388608||!f.size){err="PDF/DOCX, 8MB 이하 파일만 가능합니다.";renderSurvey();return;}if(el.dataset.upload==="resume")fileResume=f;else fileIntro=f;renderSurvey();});root.querySelectorAll("[data-remove]").forEach(el=>el.onclick=()=>{if(el.dataset.remove==="resume")fileResume=null;else fileIntro=null;renderSurvey();});}
function renderSurvey(){root.innerHTML='<section class="survey"><div class="progress"><span>STEP '+(page+1)+' / 6</span><span>'+Math.round(100*page/6)+'% 완료</span></div><div class="progressbar"><i style="width:'+(page/6*100)+'%"></i></div><h1 class="survey-title">'+steps[page]+'</h1><p class="survey-desc">'+["캠프 참가자 기본정보를 입력해 주세요.","한국 취업에 관한 생각과 희망을 알려주세요.","현재 취업 준비 수준을 솔직히 알려주세요.","현직자와 상담하고 싶은 내용을 알려주세요.","이력서·자기소개서 양식을 내려받고, 이메일 제출 또는 당일 지참 안내를 확인해 주세요.","개인정보 안내를 확인하고 최종 제출해 주세요."][page]+'</p>'+(!config.open?'<div class="notice">현재 미리보기 상태입니다. 설문 제출은 운영자가 열어야 가능합니다.</div>':'')+(err?'<div class="alert" role="alert">'+esc(err)+'</div>':'')+'<div class="card">'+showStep()+'</div><div class="buttons"><button class="back" id="back">← '+(page?"이전 단계":"안내 화면")+'</button><button class="primary" id="next" '+(page===5&&!config.open?'disabled':'')+'>'+(page===5?"설문 제출":"다음 단계 →")+'</button></div></section>';bind();document.getElementById("back").onclick=()=>{err="";if(page===0)renderIntro();else{page--;renderSurvey();}scrollTo(0,0);};document.getElementById("next").onclick=()=>{err=getError();if(err){renderSurvey();scrollTo(0,0);return;}if(page===5)submit();else{page++;err="";renderSurvey();scrollTo(0,0);}};}
async function api(action,data,admin){let opts={method:"POST",headers:{},body:null};if(admin)opts.headers["x-admin-password"]=adminPass;if(data instanceof FormData){data.append("action",action);opts.body=data;}else{opts.headers["content-type"]="application/json";opts.body=JSON.stringify(Object.assign({action},data||{}));}let res=await fetch(base,opts),body=await res.json().catch(()=>({error:"응답을 읽을 수 없습니다."}));if(!res.ok||body.error)throw Error(body.error||"요청 실패");return body;}
async function submit(){if(!config.open)return;const form=new FormData();const data=Object.assign({},answers,{consentUse:answers.consentUse==="동의합니다",consentShare:answers.consentShare==="동의합니다"});form.append("answers",JSON.stringify(data));let b=document.getElementById("next");b.disabled=true;b.textContent="제출 중...";try{let r=await api("submit",form);receipt=r.receipt;root.innerHTML='<div class="success"><span class="eyebrow">SUBMISSION COMPLETE</span><h1>사전 설문 제출이<br>완료되었습니다.</h1><p>참여해 주셔서 감사합니다. 접수 확인번호를 보관해 주세요.</p><div class="receipt">'+esc(receipt)+'</div><p>설문 응답은 캠프 상담에 활용됩니다. 이력서·자기소개서는 이메일로 보내거나 당일 노트북에 저장해 가져오세요.</p><button class="primary" onclick="location.href=location.pathname">홈으로 돌아가기</button></div>';}catch(e){err=e.message;renderSurvey();scrollTo(0,0);}}
function adminLayout(content){root.innerHTML='<section class="admin">'+content+'</section>';}
function renderAdminLogin(){adminLayout('<div class="admin-box" style="max-width:470px;margin:70px auto"><span class="eyebrow">STAFF ONLY</span><h1>운영자 로그인</h1><p class="small">설문 응답은 관리자만 열람할 수 있습니다. 이메일로 받은 서류는 별도로 확인해 주세요.</p><label>관리자 비밀번호<input class="text" id="pwd" type="password" autocomplete="off" placeholder="관리자 전용 비밀번호"></label><button class="primary" id="login">로그인 →</button><div id="loginmsg"></div></div>');document.getElementById("login").onclick=async()=>{adminPass=document.getElementById("pwd").value;try{adminData=await api("admin-list",{},true);renderAdmin();}catch(e){document.getElementById("loginmsg").innerHTML='<div class="alert">'+esc(e.message)+'</div>';}};}
function renderAdmin(){let list=adminData.submissions||[],s=adminData.settings||{};adminLayout('<h1>사전 설문 운영 현황</h1><p class="small">2026 K-유학생 취업캠프 · 국립한국교통대학교 × 충북대학교</p><div class="kpis"><span>전체 응답 <strong>'+list.length+'</strong></span><span>이력서 제출 <strong>'+list.filter(x=>x.resume_name).length+'</strong></span><span>자기소개서 제출 <strong>'+list.filter(x=>x.intro_name).length+'</strong></span><span>접수 상태 <strong>'+(s.open?"접수 중":"접수 전")+'</strong></span></div><div class="tabs"><button data-tab="settings" aria-pressed="'+(adminTab==="settings")+'">접수 설정</button><button data-tab="list" aria-pressed="'+(adminTab==="list")+'">응답 목록</button></div><div class="admin-box" id="adminbody"></div>');root.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{adminTab=el.dataset.tab;renderAdmin();});let area=document.getElementById("adminbody");if(adminTab==="settings"){area.innerHTML='<h2>개인정보 처리·접수 설정</h2><p class="small">개인정보 처리·제3자 제공 내용을 확인한 뒤 접수를 열어주세요.</p><div class="grid"><label>개인정보 처리 주체<input class="text" id="controller" value="'+esc(s.controller)+'"></label><label>개인정보 문의처<input class="text" id="contact" value="'+esc(s.contact)+'"></label><label>개인정보 보유 종료일<input class="text" id="retention" type="date" value="'+esc(s.retention)+'"></label><label>현직자 자료 보유 종료일<input class="text" id="recipientRetention" type="date" value="'+esc(s.recipientRetention)+'"></label></div><label>자료를 제공받는 자<input class="text" id="recipient" value="'+esc(s.recipient)+'" placeholder="현직자 멘토 및 운영사무국 등의 공식 명칭"></label><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="intakeOpen" '+(s.open?"checked":"")+'>학생 접수 시작</label><button class="primary" id="save">설정 저장</button><div id="adminmsg"></div><p class="small">보유기간이 지나면 운영자가 응답·서류를 삭제해야 합니다. 배포 전 개인정보 안내를 반드시 확정하세요.</p>';document.getElementById("save").onclick=async()=>{let d={controller:document.getElementById("controller").value,contact:document.getElementById("contact").value,retention:document.getElementById("retention").value,recipient:document.getElementById("recipient").value,recipientRetention:document.getElementById("recipientRetention").value,open:document.getElementById("intakeOpen").checked};try{await api("admin-settings",d,true);adminData=await api("admin-list",{},true);renderAdmin();document.getElementById("adminbody").insertAdjacentHTML("afterbegin",'<div class="notice">설정을 저장했습니다.</div>');}catch(e){document.getElementById("adminmsg").innerHTML='<div class="alert">'+esc(e.message)+'</div>';}};}else{area.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>참가자 응답</h2><button class="secondary" id="csv">CSV 다운로드</button></div><div class="table-wrap"><table><thead><tr><th>접수일</th><th>성명</th><th>소속 대학</th><th>관심 직무</th><th>서류</th><th>상세</th></tr></thead><tbody>'+list.map((x,i)=>'<tr><td>'+esc((x.created_at||"").slice(0,16))+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.university)+'</td><td>'+esc((x.answers||{}).job)+'</td><td>'+(x.resume_name?"이력서 ":"")+(x.intro_name?"자소서":"")+'</td><td><button class="secondary" data-detail="'+i+'">상세보기</button></td></tr>').join("")+'</tbody></table></div><div id="details"></div>';document.getElementById("csv").onclick=async()=>{try{let r=await api("admin-export",{},true);let blob=new Blob(["\uFEFF"+r.csv],{type:"text/csv;charset=utf-8"});download(blob,"K-CAMP_사전설문_응답.csv");}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}};root.querySelectorAll("[data-detail]").forEach(el=>el.onclick=()=>{let x=list[+el.dataset.detail],a=x.answers||{};let html='<h3>'+esc(x.name)+' 응답 상세</h3><div class="grid">'+Object.entries(a).filter(([k])=>k!=="requestId").map(([k,v])=>'<div><b>'+esc(k)+'</b><p>'+esc(Array.isArray(v)?v.join(" / "):String(v??""))+'</p></div>').join("")+'</div><p>연락처: '+esc(x.phone)+' · 이메일: '+esc(x.email)+'</p>'+(x.resume_name?'<button class="secondary" data-file="resume">이력서 다운로드</button> ':'')+(x.intro_name?'<button class="secondary" data-file="intro">자기소개서 다운로드</button> ':'')+'<button class="danger" id="delete">응답·서류 삭제</button>';let d=document.getElementById("details");d.innerHTML='<hr style="margin:24px 0">'+html;d.querySelectorAll("[data-file]").forEach(btn=>btn.onclick=async()=>{try{let r=await api("admin-file",{id:x.id,kind:btn.dataset.file},true);let buf=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));download(new Blob([buf]),r.filename||"document");}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}});document.getElementById("delete").onclick=async()=>{if(!confirm(window.kcampTranslate ? window.kcampTranslate("이 응답과 첨부파일을 영구 삭제할까요?") : "이 응답과 첨부파일을 영구 삭제할까요?"))return;try{await api("admin-delete",{id:x.id},true);adminData=await api("admin-list",{},true);renderAdmin();}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}};});}}
window.kcampRerender=function(){
  if(document.querySelector(".survey")){renderSurvey();return;}
  if(document.querySelector(".hero")){renderIntro();return;}
  if(new URLSearchParams(location.search).has("admin")){
    if(adminData)renderAdmin();else renderAdminLogin();
  }
};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
async function init(){
 if(new URLSearchParams(location.search).has("admin")){renderAdminLogin();return;}
 renderIntro();
 try{
  const response=await fetch(base+"?config=1",{cache:"no-store"});
  if(!response.ok)throw Error("Configuration unavailable");
  config=await response.json();
  if(!config.controller)config.open=false;
 }catch{
  config={open:false,controller:"",contact:"",retention:"",recipient:"",recipientRetention:""};
 }
 if(root.querySelector(".hero"))renderIntro();
}
init();
})();
</script></body></html>
