if(page===3)return optField("19","mentoring","캠프에서 가장 도움받고 싶은 내용 (최대 2개)",options.mentoring,true)+field("20","현직자에게 꼭 물어보고 싶은 질문 (선택사항)",para("mentorQuestion","궁금한 점을 자유롭게 적으세요."));
if(page===4)return '<div class="notice" style="background:#eef5f5;border-color:#cfdee0;color:#436a70">이력서와 자기소개서가 완성되지 않았더라도 초안을 제출할 수 있습니다. 주민등록번호·외국인등록번호·여권번호 등은 파일에서 제거해 주세요.</div>'+upload("21","resume","이력서 (Resume/CV)",fileResume)+upload("22","intro","자기소개서 (Self-Introduction Letter)",fileIntro);
return '<div class="privacy"><strong>개인정보 수집·이용 안내</strong><dl><dt>처리 주체</dt><dd>'+esc(config.controller)+'</dd><dt>수집 항목</dt><dd>성명, 소속, 연락처, 취업 인식·준비도, 첨부한 입사지원서</dd><dt>이용 목적</dt><dd>캠프 상담 및 멘토링 준비, 서류 컨설팅</dd><dt>보유 기한</dt><dd>'+esc(config.retention)+'</dd><dt>문의처</dt><dd>'+esc(config.contact)+'</dd><dt>제3자 제공받는 자</dt><dd>'+esc(config.recipient)+'</dd><dt>제3자 보유 기한</dt><dd>'+esc(config.recipientRetention)+'</dd></dl><p class="small">동의를 거부할 수 있습니다. 필수 수집·이용에 동의하지 않으면 사전 설문 제출은 제한됩니다. 현직자 자료 제공을 거부할 수 있으며 이 경우 관련 자료의 멘토 공유가 제한됩니다.</p></div>'+optField("23","consentUse","개인정보 수집·이용에 동의하십니까?",["동의합니다","동의하지 않습니다"])+optField("24","consentShare","현직자에게 입사지원서와 희망직무 정보 제공에 동의하십니까?",["동의합니다","동의하지 않습니다"])+field("✓","캠프 참여 코드",inp("code","운영자가 안내한 코드"));
}
function upload(n,key,title,f){return '<div class="field"><strong>'+n+' '+esc(title)+' <span class="small">(선택)</span></strong><div class="upload"><div style="font-size:29px;color:#85516b">⇧</div><p>'+(f?esc(f.name):"PDF 또는 DOCX · 8MB 이하 · 미완성 초안 가능")+'</p><label>파일 선택<input type="file" data-upload="'+key+'" accept=".pdf,.docx"></label>'+(f?'<button type="button" class="secondary" data-remove="'+key+'">선택 취소</button>':'')+'</div></div>';}
function getError(){let a=answers;if(page===0&&![a.name,a.university,a.major,a.grade,a.graduation,a.email,a.phone].every(x=>String(x||"").trim()))return"기본정보를 모두 작성해 주세요.";if(page===0&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email)||!/^[\d+\s()-]{8,25}$/.test(a.phone)))return"이메일 또는 연락처를 확인해 주세요.";if(page===1&&(!a.intent||!a.region||!(a.industries||[]).length||!a.job||!(a.difficulties||[]).length))return"필수 취업 인식 질문을 모두 작성해 주세요.";if(page===2&&(!(a.readiness||[]).every(n=>Number.isInteger(n)&&n>=1&&n<=5)||a.readiness.length!==6||!a.stage||!a.korean||!a.resumeStatus||!a.introStatus))return"준비도 6개 항목과 준비 상태를 모두 입력해 주세요.";if(page===3&&!(a.mentoring||[]).length)return"멘토링 희망 항목을 1개 이상 선택해 주세요.";if(page===5&&a.consentUse!=="동의합니다")return"개인정보 수집·이용에 동의해야 제출할 수 있습니다.";if(page===5&&!a.consentShare)return"현직자 제공에 대한 동의 여부를 선택해 주세요.";if(page===5&&!a.code)return"참여 코드를 입력해 주세요.";return"";}
function bind(){root.querySelectorAll("[data-field]").forEach(el=>{el.addEventListener("input",()=>set(el.dataset.field,el.value));});root.querySelectorAll("[data-key]").forEach(el=>el.onclick=()=>{let k=el.dataset.key,v=el.dataset.choice;if(el.dataset.multi==="1"){let arr=answers[k]||[];if(arr.includes(v))arr=arr.filter(x=>x!==v);else if(k!=="mentoring"||arr.length<2)arr=[...arr,v];set(k,arr);}else set(k,v);root.querySelectorAll('[data-key="'+k+'"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.multi==="1"?String((answers[k]||[]).includes(b.dataset.choice)):String(answers[k]===b.dataset.choice)));});root.querySelectorAll("[data-rating]").forEach(el=>el.onclick=()=>{let i=+el.dataset.rating;answers.readiness=answers.readiness||[0,0,0,0,0,0];answers.readiness[i]=+el.dataset.score;root.querySelectorAll('[data-rating="'+i+'"]').forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.score===+el.dataset.score)));});root.querySelectorAll("[data-upload]").forEach(el=>el.onchange=()=>{let f=el.files[0];if(!f)return;if(!/\.(pdf|docx)$/i.test(f.name)||f.size>8388608||!f.size){err="PDF/DOCX, 8MB 이하 파일만 가능합니다.";renderSurvey();return;}if(el.dataset.upload==="resume")fileResume=f;else fileIntro=f;renderSurvey();});root.querySelectorAll("[data-remove]").forEach(el=>el.onclick=()=>{if(el.dataset.remove==="resume")fileResume=null;else fileIntro=null;renderSurvey();});}
function renderSurvey(){root.innerHTML='<section class="survey"><div class="progress"><span>STEP '+(page+1)+' / 6</span><span>'+Math.round(100*page/6)+'% 완료</span></div><div class="progressbar"><i style="width:'+(page/6*100)+'%"></i></div><h1 class="survey-title">'+steps[page]+'</h1><p class="survey-desc">'+["캠프 참가자 기본정보를 입력해 주세요.","한국 취업에 관한 생각과 희망을 알려주세요.","현재 취업 준비 수준을 솔직히 알려주세요.","현직자와 상담하고 싶은 내용을 알려주세요.","준비한 서류 또는 작성 중인 초안을 첨부해 주세요.","개인정보 안내를 확인하고 최종 제출해 주세요."][page]+'</p>'+(!config.open?'<div class="notice">현재 미리보기 상태입니다. 설문 제출은 운영자가 열어야 가능합니다.</div>':'')+(err?'<div class="alert" role="alert">'+esc(err)+'</div>':'')+'<div class="card">'+showStep()+'</div><div class="buttons"><button class="back" id="back">← '+(page?"이전 단계":"안내 화면")+'</button><button class="primary" id="next" '+(page===5&&!config.open?'disabled':'')+'>'+(page===5?"설문 제출":"다음 단계 →")+'</button></div></section>';bind();document.getElementById("back").onclick=()=>{err="";if(page===0)renderIntro();else{page--;renderSurvey();}scrollTo(0,0);};document.getElementById("next").onclick=()=>{err=getError();if(err){renderSurvey();scrollTo(0,0);return;}if(page===5)submit();else{page++;err="";renderSurvey();scrollTo(0,0);}};}
async function api(action,data,admin){let opts={method:"POST",headers:{},body:null};if(admin)opts.headers["x-admin-password"]=adminPass;if(data instanceof FormData){data.append("action",action);opts.body=data;}else{opts.headers["content-type"]="application/json";opts.body=JSON.stringify(Object.assign({action},data||{}));}let res=await fetch(base,opts),body=await res.json().catch(()=>({error:"응답을 읽을 수 없습니다."}));if(!res.ok||body.error)throw Error(body.error||"요청 실패");return body;}
async function submit(){if(!config.open)return;const form=new FormData();const data=Object.assign({},answers,{consentUse:answers.consentUse==="동의합니다",consentShare:answers.consentShare==="동의합니다"});delete data.code;form.append("answers",JSON.stringify(data));form.append("code",answers.code);if(fileResume)form.append("resume",fileResume);if(fileIntro)form.append("intro",fileIntro);let b=document.getElementById("next");b.disabled=true;b.textContent="제출 중...";try{let r=await api("submit",form);receipt=r.receipt;root.innerHTML='<div class="success"><span class="eyebrow">SUBMISSION COMPLETE</span><h1>사전 설문 제출이<br>완료되었습니다.</h1><p>참여해 주셔서 감사합니다. 접수 확인번호를 보관해 주세요.</p><div class="receipt">'+esc(receipt)+'</div><p>제출 자료는 캠프 상담과 서류 컨설팅에 활용됩니다.</p><button class="primary" onclick="location.href=location.pathname">홈으로 돌아가기</button></div>';}catch(e){err=e.message;renderSurvey();scrollTo(0,0);}}
function adminLayout(content){root.innerHTML='<section class="admin">'+content+'</section>';}
function renderAdminLogin(){adminLayout('<div class="admin-box" style="max-width:470px;margin:70px auto"><span class="eyebrow">STAFF ONLY</span><h1>운영자 로그인</h1><p class="small">설문 응답과 첨부파일은 관리자만 열람할 수 있습니다.</p><label>관리자 비밀번호<input class="text" id="pwd" type="password" autocomplete="off" placeholder="관리자 전용 비밀번호"></label><button class="primary" id="login">로그인 →</button><div id="loginmsg"></div></div>');document.getElementById("login").onclick=async()=>{adminPass=document.getElementById("pwd").value;try{adminData=await api("admin-list",{},true);renderAdmin();}catch(e){document.getElementById("loginmsg").innerHTML='<div class="alert">'+esc(e.message)+'</div>';}};}
function renderAdmin(){let list=adminData.submissions||[],s=adminData.settings||{};adminLayout('<h1>사전 설문 운영 현황</h1><p class="small">2026 K-유학생 취업캠프 · 국립한국교통대학교 × 충북대학교</p><div class="kpis"><span>전체 응답 <strong>'+list.length+'</strong></span><span>이력서 제출 <strong>'+list.filter(x=>x.resume_name).length+'</strong></span><span>자기소개서 제출 <strong>'+list.filter(x=>x.intro_name).length+'</strong></span><span>접수 상태 <strong>'+(s.open?"접수 중":"접수 전")+'</strong></span></div><div class="tabs"><button data-tab="settings" aria-pressed="'+(adminTab==="settings")+'">접수 설정</button><button data-tab="list" aria-pressed="'+(adminTab==="list")+'">응답 목록</button></div><div class="admin-box" id="adminbody"></div>');root.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{adminTab=el.dataset.tab;renderAdmin();});let area=document.getElementById("adminbody");if(adminTab==="settings"){area.innerHTML='<h2>개인정보 처리·접수 설정</h2><p class="small">개인정보 처리·제3자 제공 내용을 확인한 뒤 접수를 열어주세요.</p><div class="grid"><label>개인정보 처리 주체<input class="text" id="controller" value="'+esc(s.controller)+'"></label><label>개인정보 문의처<input class="text" id="contact" value="'+esc(s.contact)+'"></label><label>개인정보 보유 종료일<input class="text" id="retention" type="date" value="'+esc(s.retention)+'"></label><label>현직자 자료 보유 종료일<input class="text" id="recipientRetention" type="date" value="'+esc(s.recipientRetention)+'"></label></div><label>자료를 제공받는 자<input class="text" id="recipient" value="'+esc(s.recipient)+'" placeholder="현직자 멘토 및 운영사무국 등의 공식 명칭"></label><label>학생 참여 코드(8자 이상, 변경 시에만 입력)<input class="text" id="participation" type="text" autocomplete="off" placeholder="'+(s.hasCode?"기존 설정됨 - 변경할 때만 입력":"처음 설정해야 합니다")+'"></label><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="intakeOpen" '+(s.open?"checked":"")+'>학생 접수 시작</label><button class="primary" id="save">설정 저장</button><div id="adminmsg"></div><p class="small">보유기간이 지나면 운영자가 응답·서류를 삭제해야 합니다. 배포 전 개인정보 안내를 반드시 확정하세요.</p>';document.getElementById("save").onclick=async()=>{let d={controller:document.getElementById("controller").value,contact:document.getElementById("contact").value,retention:document.getElementById("retention").value,recipient:document.getElementById("recipient").value,recipientRetention:document.getElementById("recipientRetention").value,participantCode:document.getElementById("participation").value,open:document.getElementById("intakeOpen").checked};try{await api("admin-settings",d,true);adminData=await api("admin-list",{},true);renderAdmin();document.getElementById("adminbody").insertAdjacentHTML("afterbegin",'<div class="notice">설정을 저장했습니다.</div>');}catch(e){document.getElementById("adminmsg").innerHTML='<div class="alert">'+esc(e.message)+'</div>';}};}else{area.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>참가자 응답</h2><button class="secondary" id="csv">CSV 다운로드</button></div><div class="table-wrap"><table><thead><tr><th>접수일</th><th>성명</th><th>소속 대학</th><th>관심 직무</th><th>서류</th><th>상세</th></tr></thead><tbody>'+list.map((x,i)=>'<tr><td>'+esc((x.created_at||"").slice(0,16))+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.university)+'</td><td>'+esc((x.answers||{}).job)+'</td><td>'+(x.resume_name?"이력서 ":"")+(x.intro_name?"자소서":"")+'</td><td><button class="secondary" data-detail="'+i+'">상세보기</button></td></tr>').join("")+'</tbody></table></div><div id="details"></div>';document.getElementById("csv").onclick=async()=>{try{let r=await api("admin-export",{},true);let blob=new Blob(["\uFEFF"+r.csv],{type:"text/csv;charset=utf-8"});download(blob,"K-CAMP_사전설문_응답.csv");}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}};root.querySelectorAll("[data-detail]").forEach(el=>el.onclick=()=>{let x=list[+el.dataset.detail],a=x.answers||{};let html='<h3>'+esc(x.name)+' 응답 상세</h3><div class="grid">'+Object.entries(a).filter(([k])=>k!=="requestId").map(([k,v])=>'<div><b>'+esc(k)+'</b><p>'+esc(Array.isArray(v)?v.join(" / "):String(v??""))+'</p></div>').join("")+'</div><p>연락처: '+esc(x.phone)+' · 이메일: '+esc(x.email)+'</p>'+(x.resume_name?'<button class="secondary" data-file="resume">이력서 다운로드</button> ':'')+(x.intro_name?'<button class="secondary" data-file="intro">자기소개서 다운로드</button> ':'')+'<button class="danger" id="delete">응답·서류 삭제</button>';let d=document.getElementById("details");d.innerHTML='<hr style="margin:24px 0">'+html;d.querySelectorAll("[data-file]").forEach(btn=>btn.onclick=async()=>{try{let r=await api("admin-file",{id:x.id,kind:btn.dataset.file},true);let buf=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));download(new Blob([buf]),r.filename||"document");}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}});document.getElementById("delete").onclick=async()=>{if(!confirm(window.kcampTranslate ? window.kcampTranslate("이 응답과 첨부파일을 영구 삭제할까요?") : "이 응답과 첨부파일을 영구 삭제할까요?"))return;try{await api("admin-delete",{id:x.id},true);adminData=await api("admin-list",{},true);renderAdmin();}catch(e){alert(window.kcampTranslate ? window.kcampTranslate(e.message) : e.message);}};});}}
window.kcampRerender=function(){
  if(document.querySelector(".survey")){renderSurvey();return;}
  if(document.querySelector(".hero")){renderIntro();return;}
  if(new URLSearchParams(location.search).has("admin")){
    if(adminData)renderAdmin();else renderAdminLogin();
  }
};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
async function init(){if(new URLSearchParams(location.search).has("admin")){renderAdminLogin();return;}try{let response=await fetch(base+"?config=1",{cache:"no-store"});config=await response.json();if(!config.controller)config.open=false;}catch{config={open:false,controller:"",contact:"",retention:"",recipient:"",recipientRetention:""};}renderIntro();}
init();
})();
</script></body></html>
